<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>知产桥 · 完整流程演示（离线版）</title>
  <style>
    *,
    *::before,
    *::after {
      box-sizing: border-box;
    }

    html,
    body {
      height: 100%;
    }

    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
        "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      color: #1f2329;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    /* ===== 门户首页 ===== */
    .portal-page {
      position: relative;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      background: #e8f4fd;
      overflow-x: hidden;
    }

    .portal-watermark {
      position: fixed;
      inset: 0;
      z-index: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 28px;
      opacity: 0.1;
      pointer-events: none;
      user-select: none;
    }

    .watermark-text {
      font-size: 64px;
      font-weight: 800;
      color: #1e40af;
      letter-spacing: 10px;
    }

    .portal-main {
      position: relative;
      z-index: 1;
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 56px;
      width: 100%;
      padding: 64px 24px 56px;
    }

    .portal-header {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
      text-align: center;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .brand-name {
      margin: 0;
      font-size: 42px;
      font-weight: 800;
      color: #1e40af;
      letter-spacing: 8px;
    }

    .slogan {
      margin: 0;
      font-size: 18px;
      color: #5b6470;
      letter-spacing: 2px;
    }

    .portal-cards {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 32px;
      width: 100%;
      max-width: 1080px;
    }

    .portal-card {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 14px;
      padding: 46px 32px 38px;
      background: #ffffff;
      border-radius: 18px;
      border: 1px solid rgba(31, 35, 41, 0.06);
      box-shadow: 0 8px 24px rgba(31, 35, 41, 0.06);
      cursor: pointer;
      overflow: hidden;
      transition: transform 0.25s ease, box-shadow 0.25s ease,
        border-color 0.25s ease;
    }

    .portal-card::before {
      content: "";
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 6px;
      background: var(--card-color);
    }

    .portal-card:hover,
    .portal-card:focus-visible {
      transform: translateY(-8px);
      border-color: transparent;
      box-shadow: 0 20px 44px var(--card-shadow);
    }

    .card-icon {
      width: 72px;
      height: 72px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 34px;
      border-radius: 50%;
      background: var(--card-soft);
    }

    .card-title {
      margin: 0;
      font-size: 24px;
      font-weight: 700;
      color: var(--card-color);
    }

    .card-desc {
      margin: 0 0 8px;
      font-size: 15px;
      line-height: 1.6;
      color: #6b7280;
    }

    .card-btn {
      width: 100%;
      max-width: 220px;
      padding: 12px 20px;
      border: none;
      border-radius: 999px;
      background: var(--card-color);
      color: #ffffff;
      font-size: 15px;
      font-weight: 600;
      letter-spacing: 1px;
      cursor: pointer;
      box-shadow: 0 6px 16px var(--card-shadow);
      transition: filter 0.2s ease, transform 0.2s ease, box-shadow 0.2s ease;
    }

    .card-btn:hover {
      filter: brightness(1.08);
      transform: translateY(-1px);
      box-shadow: 0 10px 22px var(--card-shadow);
    }

    .portal-footer {
      position: relative;
      z-index: 1;
      display: flex;
      flex-direction: column;
      gap: 4px;
      padding: 18px 24px;
      background: rgba(255, 255, 255, 0.72);
      border-top: 1px solid rgba(30, 64, 175, 0.08);
      text-align: center;
      font-size: 13px;
      color: #5b6470;
    }

    .portal-footer p {
      margin: 0;
    }

    /* ===== 登录页 ===== */
    .auth-page {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #e8f4fd;
      padding: 24px;
    }

    .auth-card {
      width: min(430px, 100%);
      display: flex;
      flex-direction: column;
      align-items: center;
      background: #ffffff;
      border-radius: 16px;
      border-top: 6px solid var(--accent);
      padding: 44px 36px 36px;
      box-shadow: 0 12px 40px var(--accent-shadow);
    }

    .auth-card h1 {
      margin: 12px 0 0;
      font-size: 26px;
      color: var(--accent);
    }

    .auth-subtitle {
      margin: 6px 0 0;
      font-size: 14px;
      color: #6b7280;
    }

    .auth-form {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 16px;
      margin-top: 24px;
    }

    .field {
      display: flex;
      flex-direction: column;
      gap: 6px;
      text-align: left;
    }

    .field label {
      font-size: 13px;
      color: #6b7280;
    }

    .field input {
      height: 42px;
      padding: 0 14px;
      border: 1px solid #d9dee5;
      border-radius: 8px;
      font-size: 14px;
      outline: none;
      transition: border-color 0.2s ease, box-shadow 0.2s ease;
    }

    .field input:focus {
      border-color: var(--accent, #1e40af);
      box-shadow: 0 0 0 3px var(--accent-soft, rgba(30, 64, 175, 0.12));
    }

    .submit-btn {
      height: 44px;
      border: none;
      border-radius: 999px;
      background: var(--accent, #1e40af);
      color: #ffffff;
      font-size: 15px;
      font-weight: 600;
      letter-spacing: 2px;
      cursor: pointer;
      transition: filter 0.2s ease, transform 0.2s ease;
    }

    .submit-btn:hover:not(:disabled) {
      filter: brightness(1.08);
      transform: translateY(-1px);
    }

    .submit-btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .form-error {
      margin: 0;
      color: #f5222d;
      font-size: 13px;
      text-align: left;
    }

    .form-success {
      margin: 0;
      color: #52c41a;
      font-size: 13px;
      text-align: left;
    }

    .form-notice {
      margin: 0;
      color: #2563eb;
      font-size: 13px;
      text-align: left;
    }

    .hint {
      margin: 0;
      font-size: 12px;
      color: #8c8c8c;
      text-align: left;
    }

    .back-home {
      display: block;
      margin-top: 20px;
      color: #6b7280;
      font-size: 13px;
      text-decoration: none;
    }

    .back-home:hover {
      color: var(--accent, #1e40af);
    }

    .tabs {
      display: flex;
      width: 100%;
      margin-top: 24px;
      padding: 4px;
      background: #f0f5fb;
      border-radius: 10px;
    }

    .tab {
      flex: 1;
      height: 36px;
      border: none;
      border-radius: 8px;
      background: transparent;
      color: #5b6470;
      font-size: 14px;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .tab.active {
      background: #ffffff;
      color: var(--accent);
      font-weight: 600;
      box-shadow: 0 2px 8px rgba(31, 35, 41, 0.08);
    }

    .code-row {
      display: flex;
      gap: 10px;
    }

    .code-row input {
      flex: 1;
    }

    .code-btn {
      width: 116px;
      border: 1px solid var(--accent);
      border-radius: 8px;
      background: #ffffff;
      color: var(--accent);
      font-size: 13px;
      cursor: pointer;
    }

    .code-btn:disabled {
      opacity: 0.55;
      cursor: not-allowed;
    }

    .sms-tip {
      margin: 6px 0 0;
      font-size: 12px;
      color: #52c41a;
    }

    .divider {
      display: flex;
      align-items: center;
      gap: 10px;
      width: 100%;
      margin-top: 24px;
      color: #b0b8c4;
      font-size: 12px;
    }

    .divider::before,
    .divider::after {
      content: "";
      flex: 1;
      height: 1px;
      background: #eef1f5;
    }

    .third-party {
      display: flex;
      gap: 12px;
      width: 100%;
      margin-top: 14px;
    }

    .third-btn {
      flex: 1;
      height: 42px;
      border: 1px dashed #d9dee5;
      border-radius: 10px;
      background: #fafbfc;
      color: #8c8c8c;
      font-size: 13px;
      cursor: not-allowed;
    }

    /* ===== 登录后角色首页 ===== */
    .role-page {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 28px;
      padding: 32px 24px;
      text-align: center;
    }

    .role-title {
      margin: 0;
      font-size: 34px;
      font-weight: 800;
    }

    .role-subtitle {
      margin: 8px 0 0;
      color: #6b7280;
      font-size: 15px;
    }

    .role-info {
      min-width: min(360px, 100%);
      padding: 20px 24px;
      background: #ffffff;
      border-radius: 14px;
      box-shadow: 0 8px 24px rgba(31, 35, 41, 0.08);
      font-size: 14px;
      color: #4b5563;
      line-height: 1.9;
      text-align: left;
    }

    .role-info p {
      margin: 0;
    }

    .role-actions {
      display: flex;
      gap: 14px;
      flex-wrap: wrap;
      justify-content: center;
    }

    .role-actions button {
      padding: 10px 24px;
      border: none;
      border-radius: 999px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: filter 0.2s ease, transform 0.2s ease;
    }

    .role-actions button:hover {
      filter: brightness(1.08);
      transform: translateY(-1px);
    }

    .corner-home {
      position: fixed;
      top: 16px;
      left: 20px;
      z-index: 10;
      padding: 6px 12px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.85);
      border: 1px solid rgba(31, 35, 41, 0.08);
      color: #6b7280;
      font-size: 12px;
      text-decoration: none;
      cursor: pointer;
      transition: color 0.2s ease, border-color 0.2s ease;
    }

    .corner-home:hover {
      color: #1e40af;
      border-color: rgba(30, 64, 175, 0.3);
    }

    /* ===== 用户端业务流程页 ===== */
    .flow-page {
      min-height: 100vh;
      background: #e8f4fd;
      padding: 32px 20px 56px;
    }

    .flow-header {
      max-width: 640px;
      margin: 0 auto 24px;
    }

    .flow-header h1 {
      margin: 12px 0 6px;
      color: #1e40af;
      font-size: 28px;
    }

    .flow-sub {
      margin: 0;
      color: #6b7280;
      font-size: 14px;
    }

    .flow-back {
      padding: 6px 14px;
      border: 1px solid #cfe4fb;
      border-radius: 999px;
      background: #ffffff;
      color: #1e40af;
      font-size: 13px;
      cursor: pointer;
    }

    .flow-card {
      max-width: 640px;
      margin: 0 auto;
      padding: 32px;
      background: #ffffff;
      border-radius: 18px;
      border-top: 6px solid #1e40af;
      box-shadow: 0 12px 36px rgba(30, 64, 175, 0.12);
    }

    .flow-card.narrow {
      max-width: 480px;
    }

    .form-block {
      margin-bottom: 26px;
    }

    .block-label {
      display: block;
      margin-bottom: 10px;
      font-size: 14px;
      font-weight: 600;
      color: #1f2329;
    }

    .chip-group {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
    }

    .chip {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 8px 14px;
      border: 1px solid #d9dee5;
      border-radius: 999px;
      background: #fafbfc;
      font-size: 14px;
      cursor: pointer;
      transition: all 0.2s ease;
      user-select: none;
    }

    .chip.on {
      border-color: #1e40af;
      background: rgba(30, 64, 175, 0.08);
      color: #1e40af;
      font-weight: 600;
    }

    .flow-input {
      width: 100%;
      height: 42px;
      margin-top: 12px;
      padding: 0 14px;
      border: 1px solid #d9dee5;
      border-radius: 8px;
      font-size: 14px;
      outline: none;
    }

    .flow-input:focus,
    .flow-textarea:focus {
      border-color: #1e40af;
      box-shadow: 0 0 0 3px rgba(30, 64, 175, 0.12);
    }

    .flow-textarea {
      width: 100%;
      padding: 12px 14px;
      border: 1px solid #d9dee5;
      border-radius: 8px;
      font-size: 14px;
      font-family: inherit;
      resize: vertical;
      outline: none;
    }

    .flow-counter {
      margin: 6px 0 0;
      font-size: 12px;
      color: #9aa4b2;
      text-align: right;
    }

    .flow-counter.warn {
      color: #f5222d;
    }

    .upload-area {
      display: flex;
      align-items: center;
      justify-content: center;
      height: 96px;
      border: 2px dashed #bcd7f8;
      border-radius: 12px;
      background: #f6faff;
      color: #1e40af;
      font-size: 14px;
      cursor: pointer;
      transition: background 0.2s ease;
    }

    .upload-area:hover {
      background: #edf5ff;
    }

    .upload-area input {
      display: none;
    }

    .file-list {
      margin: 12px 0 0;
      padding: 0;
      list-style: none;
    }

    .file-list li {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 12px;
      margin-bottom: 8px;
      border-radius: 8px;
      background: #f6faff;
      font-size: 13px;
      color: #4b5563;
    }

    .file-list button {
      border: none;
      background: transparent;
      color: #f5222d;
      font-size: 13px;
      cursor: pointer;
    }

    .primary-btn {
      width: 100%;
      height: 46px;
      border: none;
      border-radius: 999px;
      background: #1e40af;
      color: #ffffff;
      font-size: 15px;
      font-weight: 600;
      letter-spacing: 2px;
      cursor: pointer;
      transition: filter 0.2s ease, transform 0.2s ease;
    }

    .primary-btn:hover:not(:disabled) {
      filter: brightness(1.08);
      transform: translateY(-1px);
    }

    .primary-btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .ghost-btn {
      margin-top: 20px;
      padding: 10px 26px;
      border: 1px solid #bcd7f8;
      border-radius: 999px;
      background: #ffffff;
      color: #1e40af;
      font-size: 14px;
      cursor: pointer;
    }

    .status-card {
      text-align: center;
    }

    .status-icon {
      font-size: 44px;
    }

    .status-card h2 {
      margin: 12px 0 8px;
      color: #1e40af;
    }

    .status-text {
      margin: 4px 0;
      color: #4b5563;
      font-size: 14px;
    }

    .center-card {
      max-width: 520px;
      margin: 0 auto;
      padding: 40px;
      background: #ffffff;
      border-radius: 18px;
      text-align: center;
      color: #6b7280;
    }

    .error-text {
      color: #f5222d;
    }

    .pay-summary {
      padding-bottom: 20px;
      border-bottom: 1px dashed #e5eaf0;
      text-align: left;
    }

    .pay-label {
      margin: 0 0 6px;
      color: #9aa4b2;
      font-size: 12px;
    }

    .pay-desc {
      margin: 0;
      color: #4b5563;
      font-size: 14px;
      line-height: 1.6;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .pay-amount {
      display: flex;
      align-items: baseline;
      justify-content: center;
      gap: 6px;
      padding: 28px 0;
    }

    .pay-currency {
      color: #1e40af;
      font-size: 22px;
      font-weight: 700;
    }

    .pay-num {
      color: #1e40af;
      font-size: 52px;
      font-weight: 800;
      line-height: 1;
    }

    .pay-methods {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .pay-btn {
      height: 48px;
      border: none;
      border-radius: 12px;
      color: #ffffff;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: filter 0.2s ease, transform 0.2s ease;
    }

    .pay-btn:hover:not(:disabled) {
      filter: brightness(1.08);
      transform: translateY(-1px);
    }

    .pay-btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .pay-wechat {
      background: #07c160;
    }

    .pay-alipay {
      background: #1e40af;
    }

    .waiting-spinner {
      width: 40px;
      height: 40px;
      margin: 0 auto;
      border: 4px solid #d9e9fb;
      border-top-color: #1e40af;
      border-radius: 50%;
      animation: spin 0.9s linear infinite;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    .waiting-card h2 {
      margin: 16px 0 10px;
      color: #1e40af;
    }

    .waiting-hint {
      margin: 0;
      color: #6b7280;
      font-size: 14px;
      line-height: 1.8;
    }

    .chat-box {
      max-width: 720px;
      height: 620px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      background: #ffffff;
      border-radius: 18px;
      border-top: 6px solid #1e40af;
      box-shadow: 0 12px 36px rgba(30, 64, 175, 0.12);
      overflow: hidden;
    }

    .chat-head {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 14px 20px;
      border-bottom: 1px solid #eef1f5;
      font-size: 14px;
      font-weight: 600;
      color: #1f2329;
    }

    .peer-status {
      margin-left: 8px;
      font-size: 12px;
      font-weight: 400;
      color: #9aa4b2;
    }

    .online-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #52c41a;
    }

    .chat-body {
      flex: 1;
      padding: 18px 20px;
      overflow-y: auto;
      background: #f7fafd;
    }

    .chat-msg {
      display: flex;
      flex-direction: column;
      gap: 4px;
      margin-bottom: 14px;
      max-width: 70%;
    }

    .chat-msg.mine {
      align-items: flex-end;
      margin-left: auto;
    }

    .chat-msg.theirs {
      align-items: flex-start;
    }

    .chat-bubble {
      padding: 10px 14px;
      border-radius: 14px;
      font-size: 14px;
      line-height: 1.6;
      word-break: break-word;
    }

    .chat-msg.mine .chat-bubble {
      background: #1e40af;
      color: #ffffff;
      border-bottom-right-radius: 4px;
    }

    .chat-msg.theirs .chat-bubble {
      background: #ffffff;
      color: #1f2329;
      border-bottom-left-radius: 4px;
      box-shadow: 0 2px 8px rgba(31, 35, 41, 0.06);
    }

    .chat-img {
      max-width: 220px;
      max-height: 220px;
      border-radius: 12px;
    }

    .chat-time {
      font-size: 11px;
      color: #9aa4b2;
    }

    .chat-input-row {
      display: flex;
      gap: 10px;
      padding: 14px 16px;
      border-top: 1px solid #eef1f5;
      background: #ffffff;
    }

    .chat-img-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 42px;
      height: 42px;
      border: 1px solid #d9dee5;
      border-radius: 10px;
      background: #fafbfc;
      font-size: 18px;
      cursor: pointer;
    }

    .chat-input {
      flex: 1;
      height: 42px;
      padding: 0 14px;
      border: 1px solid #d9dee5;
      border-radius: 10px;
      font-size: 14px;
      outline: none;
    }

    .chat-input:focus {
      border-color: #1e40af;
      box-shadow: 0 0 0 3px rgba(30, 64, 175, 0.12);
    }

    .chat-send {
      height: 42px;
      padding: 0 22px;
      border: none;
      border-radius: 10px;
      background: #1e40af;
      color: #ffffff;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
    }

    .my-cases {
      width: min(560px, 100%);
      text-align: left;
    }

    .my-cases h3 {
      margin: 0 0 12px;
      color: #1f2329;
      font-size: 16px;
    }

    .case-empty {
      margin: 0;
      padding: 20px;
      background: #ffffff;
      border-radius: 12px;
      color: #9aa4b2;
      font-size: 14px;
      text-align: center;
    }

    .case-items {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .case-item {
      padding: 14px 16px;
      background: #ffffff;
      border-radius: 12px;

<body>
  <div id="app"></div>
  <script>
    (function () {
      "use strict";

      var app = document.getElementById("app");
      var USERS_KEY = "zhichan_demo_users_v1";
      var SESSION_KEY = "zhichan_demo_session_v1";
      var CASES_KEY = "zhichan_demo_cases_v1";
      var SHIFTS_KEY = "zhichan_demo_shifts_v1";
      var WORK_ORDERS_KEY = "zhichan_demo_workorders_v1";
      /* ===== 工具函数 ===== */
      function logo(size) {
        return (
          '<svg width="' + size + '" height="' + size +
          '" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="知产桥商标图标">' +
          '<rect x="2" y="2" width="60" height="60" rx="16" fill="#1e40af"/>' +
          '<path d="M15 41 Q32 17 49 41" stroke="#FFFFFF" stroke-width="4.5" stroke-linecap="round" fill="none"/>' +
          '<path d="M15 41 H49" stroke="#FFFFFF" stroke-width="3.5" stroke-linecap="round"/>' +
          '<path d="M19 46.5 V50.5 M32 46.5 V50.5 M45 46.5 V50.5" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round"/>' +
          '<text x="32" y="27" text-anchor="middle" font-size="16" font-weight="700" fill="#FFFFFF" font-family="\'PingFang SC\',\'Microsoft YaHei\',sans-serif">知</text>' +
          "</svg>"
        );
      }

      function delay(ms) {
        return new Promise(function (resolve) {
          setTimeout(resolve, ms || 300);
        });
      }

      function uid(prefix) {
        return (
          (prefix || "ID") +
          "-" +
          Date.now().toString(36) +
          "-" +
          Math.random().toString(36).slice(2, 8)
        );
      }

      function nowIso() {
        return new Date().toISOString();
      }

      function escapeHtml(str) {
        return String(str).replace(/[&<>"']/g, function (ch) {
          var map = {
            "&": "&amp;",
            "<": "&lt;",
            ">": "&gt;",
            '"': "&quot;",
            "'": "&#39;"
          };
          return map[ch];
        });
      }

      function formatSize(size) {
        if (size >= 1024 * 1024) {
          return (size / 1024 / 1024).toFixed(1) + " MB";
        }
        return Math.round(size / 1024) + " KB";
      }

      function formatTime(iso) {
        var d = new Date(iso);
        return (
          (d.getHours() < 10 ? "0" : "") +
          d.getHours() +
          ":" +
          (d.getMinutes() < 10 ? "0" : "") +
          d.getMinutes()
        );
      }

      /* ===== 本地数据层 ===== */
      var USERS_VERSION = 2;
      var USERS_VER_KEY = "zhichan_demo_users_ver";

      function defaultUsers() {
        return {
          ADMIN1: { role: "ADMIN", password: "admin01", mustChangePassword: false },
          ADMIN2: { role: "ADMIN", password: "admin02", mustChangePassword: false },
          ADMIN3: { role: "ADMIN", password: "admin03", mustChangePassword: false },
          ADMIN4: { role: "ADMIN", password: "admin04", mustChangePassword: false },
          ADMIN5: { role: "ADMIN", password: "admin05", mustChangePassword: false },
          ZX20260001: { role: "EXPERT", password: "20260001", mustChangePassword: false, isOnline: true },
          ZX20260002: { role: "EXPERT", password: "20260002", mustChangePassword: false, isOnline: true },
          ZX20260003: { role: "EXPERT", password: "20260003", mustChangePassword: false, isOnline: true },
          ZX20260004: { role: "EXPERT", password: "20260004", mustChangePassword: false, isOnline: true },
          ZX20260005: { role: "EXPERT", password: "20260005", mustChangePassword: false, isOnline: true },
          ZX20260006: { role: "EXPERT", password: "20260006", mustChangePassword: false, isOnline: true },
          ZX20260007: { role: "EXPERT", password: "20260007", mustChangePassword: false, isOnline: true },
          ZX20260008: { role: "EXPERT", password: "20260008", mustChangePassword: false, isOnline: true },
          ZX20260009: { role: "EXPERT", password: "20260009", mustChangePassword: false, isOnline: true },
          ZX20260010: { role: "EXPERT", password: "20260010", mustChangePassword: false, isOnline: true },
          "demo@zhichanqiao.com": { role: "USER", password: "123456", mustChangePassword: false }
        };
      }

      function loadUsers() {
        var raw = localStorage.getItem(USERS_KEY);
        var users = null;
        if (raw) {
          try {
            users = JSON.parse(raw);
          } catch (e) {
            users = null;
          }
        }
        var versionOk = localStorage.getItem(USERS_VER_KEY) === String(USERS_VERSION);
        if (users && versionOk) {
          return users;
        }
        // 版本不一致（或首次使用）：管理端/专员端账号一律以名单表格为准重新写入，
        // 用户端自行注册的账号原样保留
        var defaults = defaultUsers();
        if (users) {
          Object.keys(users).forEach(function (k) {
            if (users[k] && users[k].role === "USER") {
              defaults[k] = users[k];
            }
          });
        }
        localStorage.setItem(USERS_KEY, JSON.stringify(defaults));

      function tryAssignExpert(c) {
        var now = new Date();
        var period =
          now.getHours() < 12 ? "MORNING" : now.getHours() < 18 ? "AFTERNOON" : "EVENING";
        var shifts = loadShifts();
        var users = loadUsers();
        var experts = Object.keys(users).filter(function (k) {
          return (
            users[k].role === "EXPERT" &&
            shifts[k + ":" + todayStr() + ":" + period] === true
          );
        });
        var cases = loadCases();
        var busy = {};
        Object.keys(cases).forEach(function (k) {
          var cc = cases[k];
          if (
            cc.expertLoginId &&
            (cc.status === "PAID" || cc.status === "READY_TO_CHAT")
          ) {
            busy[cc.expertLoginId] = true;
          }
        });
        var candidates = experts.filter(function (e) {
          return !busy[e];
        });
        if (candidates.length === 0) {
          c.status = "MATCHING";
          return { matched: false };
        }
        c.expertLoginId = candidates[0];
        // 状态保持 PAID，等待专员确认阅读完毕后进入 READY_TO_CHAT
        if (!c.messages) {
          c.messages = [];
        }
        return { matched: true };
      }

      /* ===== 路由与守卫 ===== */
      var loginByRole = {
        USER: "/user/login",
        EXPERT: "/expert/login",
        ADMIN: "/admin/login"
      };
      var homeByRole = {
        USER: "/user/home",
        EXPERT: "/expert/home",
        ADMIN: "/admin/home"
      };

      function currentPath() {
        var hash = location.hash || "#/";
        return hash.charAt(0) === "#" ? hash.slice(1) : hash;
      }

      function navigate(path) {
        if (currentPath() !== path) {
          location.hash = path;
        } else {
          render();
        }
      }

      function guard(path) {
        var session = getSession();

        if (
          path === "/user/home" ||
          path === "/user/submit" ||
          path.indexOf("/user/pay/") === 0 ||
          path.indexOf("/user/chat/") === 0
        ) {
          if (!session) {
            return "/user/login";
          }
          if (session.user.role !== "USER") {
            return homeByRole[session.user.role] || "/";
          }
          return path;
        }

        var protectedRoutes = {
          "/expert/home": "EXPERT",
          "/expert/change-password": "EXPERT",
          "/expert/tasks": "EXPERT",
          "/admin/home": "ADMIN",
          "/user/change-password": "USER",
          "/admin/change-password": "ADMIN"
        };
        if (
          path === "/admin/audit" ||
          path === "/admin/schedule" ||
          path === "/admin/records" ||
          path === "/admin/quality" ||
          path === "/admin/dashboard"
        ) {
          if (!session) {
            return "/admin/login";
          }
          if (session.user.role !== "ADMIN") {
            return homeByRole[session.user.role] || "/";
          }
          return path;
        }
        if (
          path.indexOf("/expert/task/") === 0 ||
          path.indexOf("/expert/chat/") === 0
        ) {
          if (!session) {
            return "/expert/login";
          }
          if (session.user.role !== "EXPERT") {
            return homeByRole[session.user.role] || "/";
          }
          return path;
        }
        var required = protectedRoutes[path];
        if (!required) {
          return path;
        }
        if (!session) {
          return loginByRole[required];
        }
        if (session.user.role !== required) {
          return homeByRole[session.user.role];
        }
        if (
          session.user.role === "EXPERT" &&
          session.user.mustChangePassword &&
          path !== "/expert/change-password"
        ) {
          return "/expert/change-password";
        }
        return path;
      }

            showError("请输入密码");
            return;

      function startForgotCountdown() {
        clearForgotTimer();
        forgotCountdown = 60;
        var btn = document.getElementById("resetSendBtn");
        if (btn) {
          btn.disabled = true;
          btn.textContent = forgotCountdown + "s 后重新获取";
        }
        forgotTimer = window.setInterval(function () {
          forgotCountdown -= 1;
          var b = document.getElementById("resetSendBtn");
          if (!b) {
            clearForgotTimer();
            return;
          }
          if (forgotCountdown <= 0) {
            clearForgotTimer();
            b.disabled = false;
            b.textContent = "获取验证码";
          } else {
            b.textContent = forgotCountdown + "s 后重新获取";
          }

      function handleSendResetCode() {
        var err = document.getElementById("resetError");
        var notice = document.getElementById("resetNotice");
        var account = document.getElementById("resetAccount").value.trim();
        err.style.display = "none";
        notice.style.display = "none";
        if (!validAccount(account)) {
          err.textContent = "请输入正确的手机号或邮箱";
          err.style.display = "block";
          return;
        }
        var btn = document.getElementById("resetSendBtn");
        btn.disabled = true;
        btn.textContent = "发送中…";
        mockSendResetCode(account)
          .then(function (result) {
            document.getElementById("resetCode").value = result.devCode || "";
            notice.textContent = result.message;
            notice.style.display = "block";
            startForgotCountdown();
          })
          .catch(function (ex) {
            err.textContent = ex.message || "验证码发送失败，请稍后重试";
            err.style.display = "block";
            btn.disabled = false;
            btn.textContent = "获取验证码";
          });
      }

      function mockSendResetCode(account) {
        return delay().then(function () {
          var users = loadUsers();
          if (!users[account]) {
            throw new Error("该账号未注册，请先注册");
          }
          if (forgotCode && forgotCode.account === account && Date.now() - forgotCode.ts < 60000) {
            throw new Error("验证码发送过于频繁，请 60 秒后再试");
          }
          var code = String(Math.floor(100000 + Math.random() * 900000));
          forgotCode = { account: account, code: code, ts: Date.now() };
          return { message: "测试模式：验证码已生成，已自动填入", devCode: code };
        });
      }

      function mockResetPassword(payload) {
        return delay().then(function () {
          var users = loadUsers();
          if (!users[payload.account]) {
            throw new Error("该账号未注册，请先注册");
          }
          if (!forgotCode || forgotCode.account !== payload.account || forgotCode.code !== payload.code) {
            throw new Error("验证码错误或已过期");
          }
          if (Date.now() - forgotCode.ts > 10 * 60 * 1000) {
            throw new Error("验证码已过期，请重新获取");
          }
          if (!payload.newPassword || payload.newPassword.length < 6) {
            throw new Error("新密码至少 6 位");
          }
          users[payload.account].password = payload.newPassword;
          saveUsers(users);
          forgotCode = null;
          return { message: "密码重置成功" };
        });
      }

      /* ===== 材料提交页 ===== */
      var PLATFORM_OPTIONS = ["小红书", "抖音", "Bilibili", "微信公众号", "其他"];
      var MAX_FILE_SIZE = 10 * 1024 * 1024;
      var ALLOWED_EXT = ["jpg", "jpeg", "png", "pdf", "docx"];

      function userSubmitView() {
        var html =
          '<div class="flow-page">' +
          flowHeader("提交侵权材料", "材料提交后将进入审核，审核通过自动跳转支付") +
          '<form class="flow-card" id="submitForm">' +
          '<div class="form-block">' +
          '<label class="block-label">侵权平台（多选）</label>' +
          '<div class="chip-group">' +
          PLATFORM_OPTIONS.map(function (p) {
            return '<span class="chip" data-platform="' + p + '">' + p + "</span>";
          }).join("") +
          "</div>" +
          '<input class="flow-input" id="otherPlatform" type="text" placeholder="请输入其他平台名称（选了“其他”时必填）" style="display:none">' +
          "</div>" +
          '<div class="form-block">' +
          '<label class="block-label" for="description">侵权描述（至少 20 字）</label>' +
          '<textarea class="flow-textarea" id="description" rows="5" placeholder="请详细描述侵权情况…"></textarea>' +
          '<p class="flow-counter" id="counter">0 字（20 字起）</p>' +
          "</div>" +
          '<div class="form-block">' +
          '<label class="block-label">证据上传（jpg/png/pdf/docx，≤10MB，至少 1 份）</label>' +
          '<label class="upload-area"><input type="file" id="evidenceInput" multiple accept=".jpg,.jpeg,.png,.pdf,.docx"><span>点击选择或拖入证据文件</span></label>' +
          '<ul class="file-list" id="fileList"></ul>' +
          "</div>" +
          '<div class="form-block">' +
          '<label class="block-label">联系方式（手机号或邮箱，二选一）</label>' +
          '<input class="flow-input" id="contactPhone" type="tel" placeholder="手机号">' +
          '<input class="flow-input" id="contactEmail" type="email" placeholder="邮箱">' +
          "</div>" +
          '<p class="form-error" id="submitError" style="display:none"></p>' +
          '<button type="submit" class="primary-btn" id="submitBtn">提交材料</button>' +
          "</form>" +
          "</div>";

        app.innerHTML = html;
        document.title = "提交材料 · 知产桥";

        var selected = {};
        var files = [];

        app.querySelectorAll(".chip").forEach(function (chip) {
          chip.addEventListener("click", function () {
            var p = chip.getAttribute("data-platform");
            selected[p] = !selected[p];
            chip.classList.toggle("on", !!selected[p]);
            var otherInput = document.getElementById("otherPlatform");
            otherInput.style.display = selected["其他"] ? "" : "none";
          });
        });

        document.getElementById("description").addEventListener("input", function () {
          var len = this.value.length;
          var counter = document.getElementById("counter");
          counter.textContent = len + " 字（20 字起）";
          counter.classList.toggle("warn", len > 0 && len < 20);
        });

        document.getElementById("evidenceInput").addEventListener("change", function () {
          var picked = Array.prototype.slice.call(this.files || []);
          var err = document.getElementById("submitError");
          picked.forEach(function (f) {
            var ext = (f.name.split(".").pop() || "").toLowerCase();
            if (ALLOWED_EXT.indexOf(ext) < 0) {
              err.textContent = "不支持的文件格式：" + f.name;
              err.style.display = "block";
              return;
            }
            if (f.size > MAX_FILE_SIZE) {
              err.textContent = "文件超过 10MB：" + f.name;
              err.style.display = "block";
              return;
            }
            var reader = new FileReader();
            reader.onload = function () {
              files.push({
                name: f.name,
                size: f.size,
                type: f.type || "",
                dataUrl: reader.result
              });
              renderFileList();
            };
            reader.readAsDataURL(f);
          });
          this.value = "";
        });

        function renderFileList() {
          var list = document.getElementById("fileList");
          list.innerHTML = files
            .map(function (f, i) {
              return (
                "<li><span>" +
                escapeHtml(f.name) +
                "（" +
                formatSize(f.size) +
                "）</span><button type=\"button\" data-index=\"" +
                i +
                "\">移除</button></li>"
              );
            })
            .join("");
          list.querySelectorAll("button").forEach(function (btn) {
            btn.addEventListener("click", function () {
              files.splice(Number(btn.getAttribute("data-index")), 1);
              renderFileList();
            });
          });
        }

        document.getElementById("submitForm").addEventListener("submit", function (e) {
          e.preventDefault();
          var err = document.getElementById("submitError");

          function showError(m) {
            err.textContent = m;
            err.style.display = "block";
          }

          err.style.display = "none";
          var platformList = Object.keys(selected).filter(function (p) {
            return selected[p];
          });
          var other = document.getElementById("otherPlatform").value.trim();
          var desc = document.getElementById("description").value.trim();
          var phone = document.getElementById("contactPhone").value.trim();
          var email = document.getElementById("contactEmail").value.trim();

          if (platformList.length === 0) {
            showError("请选择至少一个侵权平台");
            return;
          }
          if (platformList.indexOf("其他") >= 0 && !other) {
            showError("请填写其他平台名称");
            return;
          }
          if (desc.length < 20) {
            showError("侵权描述至少 20 字");
            return;
          }
          if (!phone && !email) {
            showError("请填写手机号或邮箱联系方式（二选一）");
            return;
          }
          if (files.length === 0) {
            showError("请至少上传 1 份证据文件");
            return;
          }

          var btn = document.getElementById("submitBtn");
          btn.disabled = true;
          btn.textContent = "提交中…";

          var payload = {
            platforms: platformList,
            otherPlatform: other || undefined,
            description: desc,
            contactPhone: phone || undefined,
            contactEmail: email || undefined
          };

          mockCreateCase(payload)
            .then(function (c) {
              var chain = Promise.resolve();
              files.forEach(function (f) {
                chain = chain.then(function () {
                  return mockUploadEvidence(c.id, f);
                });
              });
              return chain.then(function () {
                return c;
              });
            })
            .then(function (c) {
              showSubmitted(c);
            })
            .catch(function (ex) {
              showError(ex.message || "提交失败，请稍后重试");
              btn.disabled = false;
              btn.textContent = "提交材料";
            });
        });
      }

      function showSubmitted(c) {
        app.innerHTML =
          '<div class="flow-page">' +
          flowHeader("提交侵权材料") +
          '<div class="flow-card status-card">' +
          '<div class="status-icon">⏳</div>' +
          "<h2>材料已提交</h2>" +
          '<p class="status-text">案件号：' + escapeHtml(c.id) + "</p>" +
          '<p class="status-text">当前状态：审核中（PENDING_REVIEW）</p>' +
          '<p class="hint" style="text-align:center;margin-top:12px">演示环境：点击下方按钮模拟管理端审核通过</p>' +
          '<button type="button" class="primary-btn" id="approveBtn" style="margin-top:16px">模拟审核通过 → 去支付</button>' +
          '<button type="button" class="ghost-btn" data-back="/user/home">返回用户端首页</button>' +
          "</div>" +
          "</div>";

        document.title = "提交材料 · 知产桥";
        document.getElementById("approveBtn").addEventListener("click", function () {
          var btn = this;
          btn.disabled = true;
          btn.textContent = "审核中…";
          mockApproveCase(c.id).then(function () {
            navigate("/user/pay/" + c.id);

      /* ===== 匹配等待与聊天页 ===== */
      function userChatView(caseId) {
        document.title = "匹配与沟通 · 知产桥";
        app.innerHTML =
          '<div class="flow-page">' +
          flowHeader("匹配与沟通") +
          '<div id="chatContainer"></div>' +
          "</div>";

        var container = document.getElementById("chatContainer");
        chatCallback = null;
        var currentMode = "waiting";
        var renderedMessages = [];

        function renderWaiting() {
          currentMode = "waiting";
          container.innerHTML =
            '<div class="center-card waiting-card">' +
            '<div class="waiting-spinner"></div>' +
            "<h2>正在为您匹配专员…</h2>" +
            '<p class="waiting-hint">专员正在阅读您的材料，确认后双方即可开始沟通。请耐心等待3到5分钟。</p>' +
            '<button type="button" class="ghost-btn" data-retry>重新匹配</button>' +
            '<button type="button" class="ghost-btn" data-back="/user/home">返回用户端首页</button>' +
            "</div>";
          app.querySelector("[data-retry]").addEventListener("click", function () {
            var cases = loadCases();
            var c = cases[caseId];
            if (c) {
              tryAssignExpert(c);
              saveCases(cases);
            }
            renderChatOrWaiting();
          });
        }

        function renderChat(c) {
          currentMode = "chat";
          renderedMessages = (c.messages || []).slice();
          container.innerHTML =
            '<div class="chat-box">' +
            '<div class="chat-head"><span>咨询专员：' +
            escapeHtml(c.expertLoginId || "已分配专员") +
            '<span class="peer-status" id="peerStatus" data-online="0">（离线）</span>' +
            '</span><span class="online-dot"></span></div>' +
            '<div class="chat-body" id="chatBody">' +
            (c.messages || [])
              .map(function (m) {
                var mine = m.senderRole === "USER";
                var inner =
                  m.type === "image"
                    ? '<img class="chat-img" src="' + m.content + '" alt="图片消息">'
                    : m.type === "solution"
                      ? '<a class="chat-solution" href="' + m.content + '" target="_blank">📄 下载解决方案 PDF</a>'
                      : '<span class="chat-bubble">' + escapeHtml(m.content) + "</span>";
                return (
                  '<div class="chat-msg ' +
                  (mine ? "mine" : "theirs") +
                  '">' +
                  inner +
                  '<span class="chat-time">' +
                  formatTime(m.createdAt) +
                  "</span></div>"
                );
              })
              .join("") +
            "</div>" +
            '<div class="chat-input-row">' +
            '<label class="chat-img-btn">🖼<input type="file" id="chatImageInput" accept="image/*" style="display:none"></label>' +
            '<input class="chat-input" id="chatInput" type="text" placeholder="输入消息…">' +
            '<button type="button" class="chat-send" id="chatSend">发送</button>' +
            "</div>" +
            "</div>";

          var body = document.getElementById("chatBody");
          body.scrollTop = body.scrollHeight;
          body.addEventListener("click", function (e) {
            var a = e.target.closest(".chat-solution");
            if (a) {
              e.preventDefault();
              openPdfPreview({ name: "解决方案", dataUrl: a.getAttribute("href") });
            }
          });

          chatCallback = function (msg) {
            renderedMessages.push(msg);
            var mine = msg.senderRole === "USER";
            var inner =
              msg.type === "image"
                ? '<img class="chat-img" src="' + msg.content + '" alt="图片消息">'
                : msg.type === "solution"
                  ? '<a class="chat-solution" href="' + msg.content + '" target="_blank">📄 下载解决方案 PDF</a>'
                  : '<span class="chat-bubble">' + escapeHtml(msg.content) + "</span>";
            var node = document.createElement("div");
            node.className = "chat-msg " + (mine ? "mine" : "theirs");
            node.innerHTML =
              inner + '<span class="chat-time">' + formatTime(msg.createdAt) + "</span>";
            body.appendChild(node);
            body.scrollTop = body.scrollHeight;
          };

          document.getElementById("chatSend").addEventListener("click", sendText);
          document.getElementById("chatInput").addEventListener("keydown", function (e) {
            if (e.key === "Enter") {
              sendText();
            }
          });
          document.getElementById("chatImageInput").addEventListener("change", sendImage);
        }

        function sendText() {
          var input = document.getElementById("chatInput");
          var content = input.value.trim();
          if (!content) return;
          var user = currentUser();
          if (!user) return;
          var msg = mockSendMessage(caseId, content, "text", user);
          if (chatCallback) chatCallback(msg);
          input.value = "";
        }

        function sendImage(e) {
          var file = e.target.files && e.target.files[0];
          if (!file) return;
          var user = currentUser();
          if (!user) return;
          var reader = new FileReader();
          reader.onload = function () {
            var msg = mockSendMessage(caseId, reader.result, "image", user);
            if (chatCallback) chatCallback(msg);
          };
          reader.readAsDataURL(file);
          e.target.value = "";
        }

        function renderChatOrWaiting() {
          var c = loadCases()[caseId];
          if (!c) {
            container.innerHTML =
              '<div class="center-card"><p class="error-text">案件不存在</p></div>';
            return;
          }
          if (c.status === "COMPLETED") {
            currentMode = "ended";
            var rated = !!c.rating;
            container.innerHTML =
              '<div class="center-card"><div class="status-icon">✅</div><h2>服务已结束</h2>' +
              '<p class="waiting-hint">咨询专员已结束本次服务，感谢您的使用。</p>' +
              (rated
                ? '<p class="waiting-hint">感谢您的评分！</p>'
                : '<div class="rating-box"><p class="rating-title">为本次服务评分</p>' +
                  '<div class="stars">' +
                  [1, 2, 3, 4, 5]
                    .map(function (n) {
                      return '<button type="button" class="star on" data-star="' + n + '">★</button>';
                    })
                    .join("") +
                  '</div><textarea class="rating-feedback" id="ratingFeedback" rows="2" placeholder="反馈意见（可选）"></textarea>' +
                  '<p class="form-error" id="ratingError" style="display:none"></p>' +
                  '<button type="button" class="ghost-btn" id="ratingSubmit">提交评分</button></div>') +
              '<button type="button" class="ghost-btn" data-back="/user/home">返回用户端首页</button></div>';
            if (!rated) {
              var starEls = container.querySelectorAll(".star");
              var score = 5;
              starEls.forEach(function (el) {
                el.addEventListener("click", function () {
                  score = Number(el.getAttribute("data-star"));
                  starEls.forEach(function (s) {
                    s.classList.toggle("on", Number(s.getAttribute("data-star")) <= score);
                  });
                });
              });
              document.getElementById("ratingSubmit").addEventListener("click", function () {
                var feedback = document.getElementById("ratingFeedback").value.trim();
                try {
                  mockRateCase(caseId, score, feedback);
                  renderChatOrWaiting();
                } catch (ex) {
                  var err = document.getElementById("ratingError");
                  err.textContent = ex.message;
                  err.style.display = "block";
                }
              });
            }
          } else if (c.status === "READY_TO_CHAT") {
            renderChat(c);
          } else if (c.status === "PENDING_REVIEW" || c.status === "APPROVED") {
            container.innerHTML =
              '<div class="center-card"><p class="error-text">案件尚未支付，请先完成支付</p>' +
              '<button type="button" class="ghost-btn" data-back="/user/home">返回用户端首页</button></div>';
          } else {
            renderWaiting();
          }
        }

        renderChatOrWaiting();

        function appendMissing(list) {
          if (!chatCallback) return;
          var existing = {};
          renderedMessages.forEach(function (m) {
            existing[m.id] = true;
          });
          list.forEach(function (m) {
            if (!existing[m.id]) {
              renderedMessages.push(m);
              chatCallback(m);
            }
          });
        }

        function syncChatFromStorage() {
          var c = loadCases()[caseId];
          if (!c) return;
          if (c.status === "COMPLETED") {
            if (currentMode !== "ended") renderChatOrWaiting();
            return;
          }
          if (c.status === "READY_TO_CHAT") {
            if (currentMode !== "chat") {
              renderChat(c);
            } else {
              appendMissing(c.messages || []);
            }
            return;
          }
          if (currentMode === "chat") {
            appendMissing(c.messages || []);
          }
        }

        writePresence();
        presenceTimer = window.setInterval(function () {
          writePresence();
          var el = document.getElementById("peerStatus");
          if (el) {
            var online = isOnline("EXPERT");
            el.setAttribute("data-online", online ? "1" : "0");
            el.textContent = online ? "（在线）" : "（离线）";
          }
        }, 2000);

        currentStorageSync = function (e) {
          if (e.key === CASES_KEY || e.key === null) {
            syncChatFromStorage();
          }
        };
        window.addEventListener("storage", currentStorageSync);

        // 排队时轮询匹配状态
        clearDemoPoll();
        demoPollTimer = window.setInterval(function () {
          var c = loadCases()[caseId];
          if (c && c.status === "READY_TO_CHAT") {
            clearDemoPoll();
            renderChat(c);
          }
        }, 2000);
      }

      /* ===== 咨询专员端：待办/详情/沟通 ===== */

          .sort(function (a, b) {

          });

        var itemsHtml =
          list.length === 0
            ? '<p class="case-empty">暂无待办案件</p>'
            : '<div class="case-items">' +
              list
                .map(function (c) {
                  var statusText =
                    c.status === "PAID" ? "待确认阅读" : STATUS_TEXT[c.status] || c.status;
                  return (
                    '<div class="case-item" data-case="' + c.id + '">' +
                    '<div class="case-head"><span class="case-platforms">' +
                    escapeHtml(c.platforms.join("、")) +
                    '</span><span class="case-status">' +
                    statusText +
                    "</span></div>" +

      function isDutyValue(v) {
        var s = String(v || "").replace(/[\s\u00A0\u3000]+/g, "").toLowerCase();
        if (!s) return false;
        // 明确的“不值班”标记之外，其余（√/✔/✓/☑ 等任意勾选写法）均视为值班中
        return ["×", "✗", "否", "0", "false", "no", "n", "无", "休", "-", "—"].indexOf(s) < 0;
      }

      function parseCsvLine(line) {
        var out = [];
        var cur = "";
        var inQ = false;
        for (var i = 0; i < line.length; i++) {
          var ch = line[i];
          if (inQ) {
            if (ch === '"') {
              if (line[i + 1] === '"') {
                cur += '"';
                i++;
              } else {
                inQ = false;
              }
            } else {
              cur += ch;
            }
          } else if (ch === '"') {
            inQ = true;
          } else if (ch === ",") {
            out.push(cur.trim());
            cur = "";
          } else {
            cur += ch;
          }
        }
        out.push(cur.trim());
        return out;
      }

      function colIndex(letters) {
        var n = 0;
        for (var i = 0; i < letters.length; i++) {
          n = n * 26 + (letters.charCodeAt(i) - 64);
        }
        return n - 1;
      }

      function xmlUnescape(s) {
        return String(s)
          .replace(/&amp;/g, "&")
          .replace(/&lt;/g, "<")
          .replace(/&gt;/g, ">")
          .replace(/&quot;/g, '"')
          .replace(/&#39;/g, "'")
          .replace(/&apos;/g, "'");
      }

      function cleanHeader(h) {
        return String(h || "").replace(/[\s\u00A0\u3000]+/g, "").toLowerCase();
      }

      function headerScore(grid) {
        var score = 0;
        for (var r = 0; r < Math.min(grid.length, 20); r++) {
          var hasDate = false;
          var hasExpert = false;
          (grid[r] || []).forEach(function (cell) {
            var c = cleanHeader(cell);
            if (c.indexOf("日期") >= 0 || c === "date") hasDate = true;
            if (c.indexOf("专员") >= 0) hasExpert = true;
          });
          if (hasDate && hasExpert) score++;
        }
        return score;
      }

      function normalizeDate(v, fmt) {
        var s = String(v || "").trim();
        if (!s) return "";
        // Excel 日期序列号（1900 日期系统），支持带小数（含时分）
        var serialMatch = s.match(/^(\d{4,6})(\.\d+)?$/);
        if (serialMatch) {
          var serial = Number(serialMatch[1]);
          if (serial >= 10000 && serial <= 80000) {
            var d = new Date(Math.round((serial - 25569) * 86400 * 1000));
            if (!isNaN(d.getTime())) {
              return (
                d.getUTCFullYear() +
                "-" +
                String(d.getUTCMonth() + 1).padStart(2, "0") +
                "-" +
                String(d.getUTCDate()).padStart(2, "0")
              );
            }
          }
        }
        // 月.日（如 8.1、8.11）→ 今年-月-日
        var md = s.match(/^(\d{1,2})\.(\d{1,2})$/);
        if (md) {
          var mon = Number(md[1]);
          var dayPart = md[2];
          var day = Number(dayPart);
          // 单元格数字格式为两位小数（如 0.00）时，8.1 表示显示为 8.10（8月10日）
          if (fmt && fmt.indexOf("0.00") >= 0 && dayPart.length === 1 && day >= 1 && day <= 9) {
            day = day * 10;
          }
          if (mon >= 1 && mon <= 12 && day >= 1 && day <= 31) {
            return (
              new Date().getFullYear() +
              "-" +
              String(mon).padStart(2, "0") +
              "-" +
              String(day).padStart(2, "0")
            );
          }
        }
        // 2026/8/10 或 2026.8.10（可带时间部分）-> 2026-08-10
        var m = s.match(/^(\d{4})[\/\.\-](\d{1,2})[\/\.\-](\d{1,2})([\sT].*)?$/);
        if (m) {
          return (
            m[1] +
            "-" +
            String(Number(m[2])).padStart(2, "0") +
            "-" +
            String(Number(m[3])).padStart(2, "0")
          );
        }
        return s;
      }

      async function xlsxToGrid(file) {
        var buf = await file.arrayBuffer();
        var u8 = new Uint8Array(buf);
        var view = new DataView(buf);

        var eocd = -1;
        for (var i = u8.length - 22; i >= 0; i--) {
          if (
            u8[i] === 0x50 && u8[i + 1] === 0x4b &&
            u8[i + 2] === 0x05 && u8[i + 3] === 0x06
          ) {
            eocd = i;
            break;
          }
        }
        if (eocd < 0) {
          throw new Error("无法识别的 Excel 文件");
        }

        var cdCount = view.getUint16(eocd + 10, true);
        var cdOffset = view.getUint32(eocd + 16, true);
        var files = {};
        var p = cdOffset;
        for (var n = 0; n < cdCount; n++) {
          if (view.getUint32(p, true) !== 0x02014b50) break;
          var method = view.getUint16(p + 10, true);
          var compSize = view.getUint32(p + 20, true);
          var nameLen = view.getUint16(p + 28, true);
          var extraLen = view.getUint16(p + 30, true);
          var commentLen = view.getUint16(p + 32, true);
          var localOffset = view.getUint32(p + 42, true);
          var name = "";
          for (var c = 0; c < nameLen; c++) {
            name += String.fromCharCode(u8[p + 46 + c]);
          }
          var lp = localOffset;
          var lnameLen = view.getUint16(lp + 26, true);
          var lextraLen = view.getUint16(lp + 28, true);
          var dataStart = lp + 30 + lnameLen + lextraLen;
          files[name] = {
            method: method,
            bytes: u8.slice(dataStart, dataStart + compSize)
          };
          p += 46 + nameLen + extraLen + commentLen;
        }

        async function inflate(bytes) {
          if (typeof DecompressionStream === "undefined") {
            throw new Error("当前浏览器不支持 Excel 解析，请使用新版 Chrome/Edge");
          }
          var ds = new DecompressionStream("deflate-raw");
          var stream = new Blob([bytes]).stream().pipeThrough(ds);
          var ab = await new Response(stream).arrayBuffer();
          return new TextDecoder().decode(ab);
        }

        function decodeEntry(entry) {
          return entry.method === 8
            ? inflate(entry.bytes)
            : Promise.resolve(new TextDecoder().decode(entry.bytes));
        }

        var sharedStrings = [];
        if (files["xl/sharedStrings.xml"]) {
          var sharedXml = await decodeEntry(files["xl/sharedStrings.xml"]);
          var sm = sharedXml.match(/<si>[\s\S]*?<\/si>/g) || [];
          sm.forEach(function (si) {
            var t = si.match(/<t[^>]*>([\s\S]*?)<\/t>/);
            sharedStrings.push(t ? xmlUnescape(t[1]) : "");
          });
        }

        // 读取单元格数字格式（样式索引 -> 格式代码），用于识别 0.00 这类两位小数日期
        var cellFormats = [];
        if (files["xl/styles.xml"]) {
          var stylesXml = await decodeEntry(files["xl/styles.xml"]);
          var numFmts = {
            "0": "General",
            "9": "0%",
            "10": "0.00%",
            "14": "m/d/yyyy",
            "22": "m/d/yyyy h:mm"
          };
          var nm = stylesXml.match(/<numFmt numFmtId="(\d+)" formatCode="([^"]*)"/g) || [];
          nm.forEach(function (item) {
            var id = (item.match(/numFmtId="(\d+)"/) || [])[1];
            var code = (item.match(/formatCode="([^"]*)"/) || [])[1];
            if (id) numFmts[id] = xmlUnescape(code);
          });
          var cm = stylesXml.match(/<cellXfs[^>]*>([\s\S]*?)<\/cellXfs>/);
          if (cm) {
            var xfs = cm[1].match(/<xf\b[^>]*>/g) || [];
            xfs.forEach(function (x) {
              var id = (x.match(/numFmtId="(\d+)"/) || [])[1] || "0";
              cellFormats.push(numFmts[id] || "General");
            });
          }
        }

        var sheetNames = Object.keys(files).filter(function (k) {
          return /^xl\/worksheets\/sheet\d+\.xml$/.test(k);
        });
        if (!sheetNames.length) {
          throw new Error("Excel 中没有工作表");
        }

        function xmlSheetToGrid(sheetXml) {
          var grid = [];
          var formats = [];
          var rowMatches = sheetXml.match(/<row[^>]*>[\s\S]*?<\/row>/g) || [];
          rowMatches.forEach(function (rm) {
            var row = [];
            var rowFmts = [];
            var cellMatches = rm.match(/<c\b[^>]*>[\s\S]*?<\/c>/g) || [];
            cellMatches.forEach(function (cm) {
              var rmatch = cm.match(/r="([A-Z]+)\d+"/);
              if (!rmatch) return;
              var col = colIndex(rmatch[1]);
              var styleIdx = (cm.match(/s="(\d+)"/) || [])[1];
              var t = (cm.match(/t="([^"]+)"/) || [])[1] || "";
              var v = (cm.match(/<v>([\s\S]*?)<\/v>/) || [])[1] || "";
              var val;
              if (t === "s") {
                val = sharedStrings[Number(v)] || "";
              } else if (t === "inlineStr") {
                var it = cm.match(/<t[^>]*>([\s\S]*?)<\/t>/);
                val = it ? xmlUnescape(it[1]) : "";
              } else {
                val = v;
              }
              row[col] = xmlUnescape(val);
              rowFmts[col] = styleIdx !== undefined ? (cellFormats[Number(styleIdx)] || "") : "";
            });
            grid.push(row);
            formats.push(rowFmts);
          });
          return { grid: grid, formats: formats };
        }

        // 遍历所有工作表，优先选择包含“日期+专员”表头的工作表
        var best = null;
        for (var si = 0; si < sheetNames.length; si++) {
          var sheetData = xmlSheetToGrid(await decodeEntry(files[sheetNames[si]]));
          var score = headerScore(sheetData.grid);
          if (!best || score > best.score) {
            best = {
              sheet: sheetNames[si],
              grid: sheetData.grid,
              formats: sheetData.formats,
              score: score
            };
          }
        }
        return { grid: best.grid, formats: best.formats || [] };
      }

      async function parseScheduleFile(file) {
        var grid;
        var formats = [];
        if (/\.csv$/i.test(file.name)) {
          var text = await file.text();
          // 兼容 Excel 导出的 UTF-8 BOM
          if (text.charCodeAt(0) === 0xfeff) {
            text = text.slice(1);
          }
          grid = text
            .split(/\r?\n/)
            .filter(function (r) {
              return r.trim() !== "";
            })
            .map(parseCsvLine);
        } else {
          var xlsxData = await xlsxToGrid(file);
          grid = xlsxData.grid;
          formats = xlsxData.formats || [];
        }
        return { grid: grid, formats: formats };
      }

      var IMPORT_PERIODS = [
        { period: "MORNING", keyword: "上午", headers: ["上午", "am", "morning"] },
        { period: "AFTERNOON", keyword: "下午", headers: ["下午", "pm", "afternoon"] },
        { period: "EVENING", keyword: "晚上", headers: ["晚上", "夜班", "evening"] }
      ];

      function adminImportExcel(file) {
        parseScheduleFile(file)
          .then(function (data) {
            var grid = data.grid;
            var formats = data.formats || [];
            if (!grid.length) {
              throw new Error("Excel 内容为空");
            }
            // 自动定位表头行（兼容顶部标题行）
            var headerRowIdx = 0;
            for (var r = 0; r < Math.min(grid.length, 20); r++) {
              var hasDate = false;
              var hasExpert = false;
              grid[r].forEach(function (cell) {
                var c = cleanHeader(cell);
                if (c.indexOf("日期") >= 0 || c === "date") hasDate = true;
                if (c.indexOf("专员") >= 0) hasExpert = true;
              });
              if (hasDate && hasExpert) {
                headerRowIdx = r;
                break;
              }
            }
            var header = grid[headerRowIdx];
            var idx = {};
            header.forEach(function (h, i) {
              idx[cleanHeader(h)] = i;
            });
            var idCol = null;
            ["专员编号", "专员号", "专员", "编号", "loginid", "id"].forEach(function (k) {
              if (idCol === null && idx[k] !== undefined) idCol = idx[k];
            });
            var dateCol = null;
            ["日期", "date"].forEach(function (k) {
              if (dateCol === null && idx[k] !== undefined) dateCol = idx[k];
            });
            if (idCol === null || dateCol === null) {
              throw new Error("表头需包含：专员编号、日期，以及上午/下午/晚上值班列");
            }
            var periodCols = IMPORT_PERIODS.map(function (pk) {
              var col = null;
              pk.headers.forEach(function (h) {
                if (col === null && idx[h] !== undefined) col = idx[h];
              });
              if (col === null) {
                header.forEach(function (h, i) {
                  if (col === null && cleanHeader(h).indexOf(pk.keyword) >= 0) col = i;
                });
              }
              return { period: pk.period, col: col };
            });

            var created = 0;
            var updated = 0;
            var shiftsSet = 0;
            var errors = [];
            var firstDate = null;
            var firstRowValues = null;
            var rowDetails = [];
            var rowsProcessed = 0;
            grid.slice(headerRowIdx + 1).forEach(function (row, di) {
              var loginId = String(row[idCol] || "").trim();
              var dateFmt = (formats[headerRowIdx + 1 + di] || [])[dateCol] || "";
              var date = normalizeDate(String(row[dateCol] || "").trim(), dateFmt);
              rowsProcessed++;
              var rowDetail = {
                loginId: loginId,
                date: date,
                periods: periodCols.map(function (pc) {
                  return pc.col === null ? "-" : String(row[pc.col] || "").trim();
                })
              };
              if (rowDetails.length < 8) {
                rowDetails.push(rowDetail);
              }
              if (firstRowValues === null) {
                firstRowValues = rowDetail;
              }
              if (!loginId || !date) {
                errors.push("缺少专员编号或日期");
                return;
              }
              if (firstDate === null) firstDate = date;
              if (ensureExpertAccount(loginId)) {
                created++;
              } else {
                updated++;
              }
              var shifts = loadShifts();
              periodCols.forEach(function (pc) {
                if (pc.col === null) return;
                var v = String(row[pc.col] || "").trim();
                // 勾选标记（√/✔/✓/☑ 等）表示值班；空白或 ×/否/0 视为不值班
                shifts[loginId + ":" + date + ":" + pc.period] = isDutyValue(v);
                shiftsSet++;
              });
              saveShifts(shifts);
            });

            admImportMsg =
              "导入完成：新增专员 " + created + " 名，更新 " + updated +
              " 名，设置值班 " + shiftsSet + " 项" +
              (firstDate ? "（排班日期已切换至 " + firstDate + "）" : "") +
              (errors.length ? "，跳过 " + errors.length + " 条" : "");
            if (shiftsSet === 0 && rowsProcessed > 0 && firstRowValues) {
              admImportMsg +=
                "；未识别到值班标记，首行读取值为：编号=" +
                (firstRowValues.loginId || "空") +
                " 日期=" +
                (firstRowValues.date || "空") +
                " 时段=" +
                firstRowValues.periods.map(function (p) { return p || "空"; }).join("/");
            }
            if (firstDate) {
              admScheduleDate = firstDate;
            }
            admImportDebug =
              "表头行：第 " + (headerRowIdx + 1) + " 行 | " +
              "列匹配：日期=" + dateCol + " 专员=" + idCol +
              " 上午=" + (periodCols[0].col === null ? "-" : periodCols[0].col) +
              " 下午=" + (periodCols[1].col === null ? "-" : periodCols[1].col) +
              " 晚上=" + (periodCols[2].col === null ? "-" : periodCols[2].col) +
              " | 数据行数：" + rowsProcessed +
              (firstRowValues
                ? " | 首行值：" + JSON.stringify(firstRowValues)
                : "") +
              (rowDetails.length
                ? " | 行明细：" + JSON.stringify(rowDetails)
                : "");
            render();
          })
          .catch(function (e) {
            admImportMsg = "导入失败：" + (e && e.message ? e.message : e);
            admImportDebug = null;
            render();
          });
      }

            '<select class="adm-select" id="gradeSel"><option value="EXCELLENT">优秀</option><option value="QUALIFIED" selected>合格</option><option value="NEEDS_IMPROVEMENT">待改进</option></select>' +
            '<textarea class="adm-textarea" id="gradeContent" rows="3" placeholder="监督内容"></textarea>' +
            '<textarea class="adm-textarea" id="gradeSuggestion" rows="2" placeholder="改进建议（后台私信发给专员，可选）"></textarea>' +
            '<p class="form-error" id="admError" style="display:none"></p>' +
            '<button type="button" class="adm-btn primary" id="gradeSubmit">生成工单</button>' +
            '<button type="button" class="adm-btn ghost" id="gradeCancel">取消</button>' +
            "</div>"
        );
        bindAdminShell();
        document.getElementById("gradeSubmit").addEventListener("click", function () {
          var content = document.getElementById("gradeContent").value.trim();
          var err = document.getElementById("admError");
          if (!content) {
            err.textContent = "请填写监督内容";
            err.style.display = "block";
            return;
          }
          createWorkOrder({
            caseId: caseId,
            expertId: c.expertLoginId,
            type: "SUPERVISION",
            grade: document.getElementById("gradeSel").value,
            title: "主动监督评级",
            content: content,
            suggestion: document.getElementById("gradeSuggestion").value.trim() || null
          });
          admQualityTab = "orders";
          render();
        });
        document.getElementById("gradeCancel").addEventListener("click", function () {
          render();
        });
      }

      function renderWorkOrders() {
        var orders = loadWorkOrders();
        var gradeText = { EXCELLENT: "优秀", QUALIFIED: "合格", NEEDS_IMPROVEMENT: "待改进" };
        var statusText2 = { PENDING: "待处理", PROCESSING: "处理中", CLOSED: "已关闭" };
        var items =
          orders.length === 0
            ? '<p class="adm-empty">暂无工单</p>'
            : orders
                .map(function (o) {
                  return (
                    '<div class="adm-item">' +
                    '<div class="adm-item-head"><b>' +
                    (o.type === "COMPLAINT" ? "⚠️ 投诉" : "🛡️ 监督") +
                    (o.grade ? " · " + (gradeText[o.grade] || o.grade) : "") +
                    " · " + escapeHtml(o.title) +
                    "</b><span class='adm-status'>" + (statusText2[o.status] || o.status) + "</span></div>" +
                    '<p class="adm-desc">' + escapeHtml(o.content) + "</p>" +
                    (o.suggestion ? '<p class="adm-desc">建议：' + escapeHtml(o.suggestion) + "</p>" : "") +
                    '<p class="adm-meta">专员：' + escapeHtml(o.expertId) + " · 案件：" + escapeHtml(o.caseId || "—") + "</p>" +
                    (o.status !== "CLOSED"
                      ? '<div class="adm-actions"><button type="button" class="adm-btn ghost" data-wo="' + o.id + '" data-status="PROCESSING">标记处理中</button>' +
                        '<button type="button" class="adm-btn reject" data-wo="' + o.id + '" data-status="CLOSED">关闭</button></div>'
                      : "") +
                    "</div>"
                  );
                })
                .join("");
        app.innerHTML = adminShell(
          "质量监管",
          '<div class="adm-tabs"><button type="button" class="adm-tab" id="tabSup">主动监督</button>' +
            '<button type="button" class="adm-tab active" id="tabOrders">工单管理（' + orders.length + "）</button></div>" +
            '<div class="adm-panel">' + items + "</div>"
        );
        bindAdminShell();
        document.getElementById("tabSup").addEventListener("click", function () {
          admQualityTab = "supervision";
          render();
        });
        document.getElementById("tabOrders").addEventListener("click", function () {
          admQualityTab = "orders";
          render();
        });
        app.querySelectorAll("[data-wo]").forEach(function (btn) {
          btn.addEventListener("click", function () {
            var list = loadWorkOrders();
            var wo = list.find(function (o) {
              return o.id === btn.getAttribute("data-wo");
            });
            if (wo) {
              wo.status = btn.getAttribute("data-status");
              saveWorkOrders(list);
              render();
            }
          });
        });
      }

      function adminDashboardView() {
        var users = loadUsers();
        var experts = Object.keys(users).filter(function (k) {
          return users[k].role === "EXPERT";
        });
        var cases = Object.keys(loadCases()).map(function (k) {
          return loadCases()[k];
        });
        var orders = loadWorkOrders();

        var stats = experts.map(function (loginId) {
          var rated = cases.filter(function (c) {
            return c.expertLoginId === loginId && c.rating;
          });
          var avg = rated.length
            ? rated.reduce(function (s, c) {
                return s + c.rating.score;
              }, 0) / rated.length
            : 0;
          var complaints = orders.filter(function (o) {
            return o.expertId === loginId && o.type === "COMPLAINT";
          }).length;
          return { loginId: loginId, avg: avg, complaints: complaints };
        });

        var maxAvg = Math.max.apply(null, stats.map(function (s) { return s.avg; }).concat([1]));
        var maxC = Math.max.apply(null, stats.map(function (s) { return s.complaints; }).concat([1]));

        function barRow(label, value, max, unit) {
          var pct = Math.round((value / max) * 100);
          return (
            '<div class="adm-bar-row"><b>' + escapeHtml(label) +
            '</b><div class="adm-bar"><div class="adm-bar-fill" style="width:' + pct +
            '%"></div></div><span>' + value + (unit || "") + "</span></div>"
          );
        }

        var statusCounts = {};
        cases.forEach(function (c) {
          statusCounts[c.status] = (statusCounts[c.status] || 0) + 1;
        });
        var statusRows = Object.keys(statusCounts)
          .map(function (s) {
            return '<span class="adm-legend">' + (STATUS_TEXT[s] || s) + "：" + statusCounts[s] + "</span>";
          })
          .join("");

        app.innerHTML = adminShell(
          "数据看板",
          '<div class="adm-cards">' +
            '<div class="adm-card"><b>' + experts.length + "</b><span>专员数量</span></div>" +
            '<div class="adm-card"><b>' + orders.filter(function (o) { return o.type === "COMPLAINT"; }).length + "</b><span>投诉工单</span></div>" +
            '<div class="adm-card"><b>' + cases.filter(function (c) { return c.status === "COMPLETED"; }).length + "</b><span>已完成案件</span></div></div>" +
            '<div class="adm-panel"><h4>各专员平均分</h4>' +
            stats.map(function (s) { return barRow(s.loginId, s.avg.toFixed(1), maxAvg, ""); }).join("") +
            "</div>" +
            '<div class="adm-panel"><h4>各专员投诉次数</h4>' +
            stats.map(function (s) { return barRow(s.loginId, s.complaints, maxC, " 次"); }).join("") +
            "</div>" +
            '<div class="adm-panel"><h4>案例状态分布</h4><div class="adm-status">' + statusRows + "</div></div>"
        );
        document.title = "数据看板 · 知产桥";
        bindAdminShell();
      }

      /* ===== 渲染入口 ===== */
      function render() {
        var path = currentPath() || "/";
        var target = guard(path);
        if (target !== path) {
          navigate(target);
          return;
        }
        ensureDemoShifts();
        clearDemoPoll();
        if (currentStorageSync) {
          window.removeEventListener("storage", currentStorageSync);
          currentStorageSync = null;
        }
        if (presenceTimer) {
          window.clearInterval(presenceTimer);
          presenceTimer = null;
        }
        var renderSession = getSession();
        if (renderSession && renderSession.user) {
          clearPresence(renderSession.user.role);
        }
        chatCallback = null;
        clearForgotTimer();

        if (path === "/") {
          document.title = "知产桥 · 一站式知识产权人工咨询服务平台";
          portalView();
        } else if (path === "/user/login") {
          document.title = "用户端登录 · 知产桥";
          userLoginTab = "login";
          userLoginView();
        } else if (path === "/user/forgot-password") {
          document.title = "重置密码 · 知产桥";
          userForgotPasswordView();
        } else if (path === "/user/change-password") {
          document.title = "修改密码 · 知产桥";
          changePasswordView("USER");
        } else if (path === "/expert/login") {
          document.title = "咨询专员端登录 · 知产桥";
          expertLoginView();
        } else if (path === "/admin/login") {
          document.title = "平台管理端登录 · 知产桥";
          adminLoginView();
        } else if (path === "/expert/change-password") {
          document.title = "修改初始密码 · 知产桥";
          changePasswordView("EXPERT");
        } else if (path === "/admin/change-password") {
          document.title = "修改密码 · 知产桥";
          changePasswordView("ADMIN");
        } else if (path === "/user/home") {
          document.title = "用户端 · 知产桥";
          userHomeView();
        } else if (path === "/expert/home") {
          document.title = "咨询专员端 · 知产桥";
          roleHomeView("EXPERT");
        } else if (path === "/expert/tasks") {
          document.title = "待办案件 · 知产桥";
          expertTasksView();
        } else if (path.indexOf("/expert/task/") === 0) {
          expertTaskDetailView(path.slice("/expert/task/".length));
        } else if (path.indexOf("/expert/chat/") === 0) {
          expertChatView(path.slice("/expert/chat/".length));
        } else if (path === "/admin/home") {
          document.title = "平台管理端 · 知产桥";
          roleHomeView("ADMIN");
        } else if (path === "/admin/audit") {
          adminAuditView();
        } else if (path === "/admin/schedule") {
          adminScheduleView();
        } else if (path === "/admin/records") {
          adminRecordsView();
        } else if (path === "/admin/quality") {
          adminQualityView();
        } else if (path === "/admin/dashboard") {
          adminDashboardView();
        } else if (path === "/user/submit") {
          userSubmitView();
        } else if (path.indexOf("/user/pay/") === 0) {
          userPayView(path.slice("/user/pay/".length));
        } else if (path.indexOf("/user/chat/") === 0) {
          userChatView(path.slice("/user/chat/".length));
        } else {
          navigate("/");
        }
      }

      // 统一处理页面内所有“返回”按钮（[data-back]），保证每个按钮都能点击
      document.addEventListener("click", function (e) {
        var el = e.target && e.target.closest ? e.target.closest("[data-back]") : null;
        if (!el) return;
        var to = el.getAttribute("data-back");
        if (to) navigate(to);
      });

      window.addEventListener("hashchange", render);
      render();
    })();
  </script>
</body>
</html>
